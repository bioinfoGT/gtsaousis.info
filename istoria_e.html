<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ιστορία Ε΄ Δημοτικού · Στα βυζαντινά χρόνια</title>
<script>try{if(localStorage.getItem("istoria-e-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Comfortaa:wght@500;700&display=swap">
<style>
:root{
  --bg:#f5ecd9; --bg2:#fffaf0; --bg3:#efe1c4;
  --gold:#b8862b; --gold-soft:#6b2a5e; --title:#6b2a5e;
  --cream:#2c1d14; --muted:#6e5a68; --off:#dccdb0;
  --line:rgba(107,42,94,.26);
  --display:"GFS Didot","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Comfortaa","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1a1020; --bg2:#26172e; --bg3:#33203d;
  --gold:#d9a945; --gold-soft:#f0cf86; --title:#d9a945;
  --cream:#f6ecd9; --muted:#bfa9c2; --off:#56405f;
  --line:rgba(217,169,69,.38);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.band{height:12px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 12px,#8d5a9e 12px 22px,transparent 22px 24px);opacity:.8;border-radius:2px}
.tbar{display:flex;justify-content:flex-end;margin:10px 0 -6px}
.theme{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--bg2);cursor:pointer;font-size:1.15rem;color:inherit}
.theme:focus-visible,.unit:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;font-weight:700;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,9vw,3.2rem);line-height:1.05;color:var(--title);margin:0;text-wrap:balance}
.hero{display:grid;gap:10px;padding:14px 0 22px;text-align:center}
.hero p{margin:0 auto;color:var(--muted);max-width:40ch}
.total{color:var(--gold);font-weight:700}
.units{display:grid;gap:12px}
.unit{display:flex;gap:14px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
a.unit:hover{border-color:var(--gold)}
a.unit:active{transform:scale(.98)}
.unit .ico{font-size:1.7rem;width:58px;height:58px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px var(--bg2),0 0 0 6px var(--line)}
.unit .txt{display:grid;gap:2px;flex:1;min-width:0}
.unit .let{font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--gold-soft)}
.unit .ttl{font-weight:700;font-size:1.02rem;line-height:1.3}
.unit .sub{font-size:.8rem;color:var(--muted)}
.unit .prog{height:6px;border-radius:99px;background:var(--bg3);overflow:hidden;margin-top:6px}
.unit .prog i{display:block;height:100%;background:var(--gold)}
.unit .st{flex:none;text-align:right;font-weight:700;color:var(--gold);font-size:.9rem;white-space:nowrap}
.unit.soon{opacity:.55;border-style:dashed}
.unit.soon .ico{background:var(--bg3)}
.unit.soon .st{color:var(--muted);font-weight:500;font-size:.78rem}
.foot{margin-top:22px;text-align:center;font-size:.78rem;color:var(--muted)}
</style>
<style>
html.locked .wrap{display:none}
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:var(--bg);z-index:50}
.gate form{width:100%;max-width:360px;background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:24px 20px;text-align:center;display:grid;gap:12px;font-family:var(--body);color:var(--cream)}
.gate .lock{font-size:2.6rem;line-height:1}
.gate h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--title)}
.gate p{margin:0;color:var(--muted);font-size:.9rem}
.gate input{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--cream);text-align:center}
.gate input:focus{outline:none;border-color:var(--gold)}
.gate button{font:inherit;font-weight:700;font-size:1.05rem;padding:13px;border:none;border-radius:12px;background:var(--gold);color:#2a1a0c;cursor:pointer}
.gate .err{color:#c43c28;font-size:.88rem;min-height:1.2em}
.gate form.shake{animation:gshake .4s ease}
@keyframes gshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
<script>
(function(){
  var OK=["1nfdknm","1k79kra"], KEY="istoria-e-ok";
  function h(s){s=s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");var x=2166136261;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0}return x.toString(36)}
  var ok=false;try{ok=OK.indexOf(localStorage.getItem(KEY))>=0}catch(e){}
  if(ok)return;
  document.documentElement.classList.add("locked");
  document.addEventListener("DOMContentLoaded",function(){
    var g=document.createElement("div");g.className="gate";
    g.innerHTML='<form autocomplete="off"><div class="lock">🔒</div><h2>Ιστορία Ε΄</h2><p>Γράψε τον κωδικό της τάξης για να μπεις.</p><input type="password" aria-label="Κωδικός" autofocus><div class="err" aria-live="polite"></div><button type="submit">Μπες →</button></form>';
    document.body.appendChild(g);
    var f=g.querySelector("form"),inp=g.querySelector("input"),err=g.querySelector(".err");
    inp.focus();
    f.addEventListener("submit",function(ev){
      ev.preventDefault();
      var v=h(inp.value);
      if(OK.indexOf(v)>=0){try{localStorage.setItem(KEY,v)}catch(e){}g.remove();document.documentElement.classList.remove("locked");window.scrollTo(0,0)}
      else{err.textContent="Λάθος κωδικός. Δοκίμασε ξανά!";f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");inp.select()}
    });
  });
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="band" aria-hidden="true"></div>
  <div class="tbar"><button class="theme" id="theme" aria-label="Αλλαγή φόντου"></button></div>
  <section class="hero">
    <div class="eyebrow">Ιστορία Ε΄ Δημοτικού</div>
    <h1>Στα βυζαντινά χρόνια</h1>
    <p>Επανάληψη ενότητα με ενότητα, με ερωτήσεις, πηγές, χρονολόγια και αντιστοιχίσεις.</p>
    <div class="total" id="total"></div>
  </section>
  <nav class="units" id="units" aria-label="Ενότητες"></nav>
  <p class="foot">Με βάση το σχολικό βιβλίο «Ιστορία Ε΄ Δημοτικού – Στα βυζαντινά χρόνια».<br>Τα αστέρια μένουν σε αυτή τη συσκευή.</p>
  <div class="band" aria-hidden="true" style="margin-top:28px"></div>
</div>
<script>
const UNITS = [{"id": "A", "letter": "Α΄", "title": "Οι Έλληνες και οι Ρωμαίοι", "range": "1–4", "ico": "⚔️", "href": "E5_A_ellines_romaioi.html", "missions": 5, "questions": 93}, {"id": "B", "letter": "Β΄", "title": "Η ρωμαϊκή αυτοκρατορία μεταμορφώνεται", "range": "5–12", "ico": "⚓", "href": "E5_B_metamorfosi.html", "missions": 9, "questions": 162}, {"id": "G", "letter": "Γ΄", "title": "Το βυζαντινό κράτος, μια δύναμη που μεγαλώνει", "range": "13–16", "ico": "⛪", "href": "E5_G_ioustinianos.html", "missions": 5, "questions": 83}, {"id": "D", "letter": "Δ΄", "title": "Το βυζαντινό κράτος και οι γειτονικοί λαοί", "range": "17–22", "ico": "🛡️", "href": null}, {"id": "E", "letter": "Ε΄", "title": "Η μεγάλη ακμή του βυζαντινού κράτους", "range": "23–27", "ico": "📚", "href": null}, {"id": "Z", "letter": "ΣΤ΄", "title": "Το Βυζάντιο παρακμάζει και υποκύπτει σε κατακτητές", "range": "28–36", "ico": "🏰", "href": null}, {"id": "H", "letter": "Ζ΄", "title": "Θέματα από τη βυζαντινή ιστορία", "range": "37–42", "ico": "🎨", "href": null}];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars = id => { try { const p = JSON.parse(localStorage.getItem('istoria-e-' + id)) || {}; return Object.values(p).reduce((a, b) => a + (+b || 0), 0); } catch (e) { return 0; } };
let got = 0, max = 0;
document.getElementById('units').innerHTML = UNITS.map(u => {
  if (!u.missions) return `<div class="unit soon"><span class="ico" aria-hidden="true">${u.ico}</span>
    <span class="txt"><span class="let">ΕΝΟΤΗΤΑ ${u.letter}</span><span class="ttl">${esc(u.title)}</span><span class="sub">Μαθήματα ${u.range}</span></span>
    <span class="st">Σύντομα</span></div>`;
  const s = stars(u.id), m = u.missions * 3; got += s; max += m;
  return `<a class="unit" href="${esc(u.href)}"><span class="ico" aria-hidden="true">${u.ico}</span>
    <span class="txt"><span class="let">ΕΝΟΤΗΤΑ ${u.letter}</span><span class="ttl">${esc(u.title)}</span>
    <span class="sub">Μαθήματα ${u.range} · ${u.questions} ερωτήσεις</span><span class="prog"><i style="width:${(s / m) * 100}%"></i></span></span>
    <span class="st">★ ${s}/${m}</span></a>`;
}).join('');
document.getElementById('total').textContent = `★ ${got} / ${max} αστέρια συνολικά`;

const tb = document.getElementById('theme');
const paint = () => { const d = document.documentElement.dataset.theme === 'dark'; tb.textContent = d ? '☀️' : '🌙'; tb.title = d ? 'Φωτεινό φόντο' : 'Σκοτεινό φόντο'; };
tb.onclick = () => { const d = document.documentElement.dataset.theme === 'dark'; if (d) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = 'dark'; try { localStorage.setItem('istoria-e-theme', d ? 'light' : 'dark'); } catch (e) {} paint(); };
paint();
</script>
</body>
</html>
