<style>
/* Ρωμαϊκό ψηφιδωτό: βαθύ πορφυρό, χρυσές ψηφίδες, πάπυρος για τις εξηγήσεις. */
:root{
  /* Φωτεινό (προεπιλογή): περγαμηνή, πορφυρά γράμματα, χρυσές ψηφίδες */
  --bg:#f5ecd9; --bg2:#fffaf0; --bg3:#efe1c4;
  --gold:#b8862b; --gold-soft:#6b2a5e; --title:#6b2a5e;
  --cream:#2c1d14; --muted:#6e5a68; --off:#dccdb0;
  --line:rgba(107,42,94,.26);
  --parch:#ffffff; --ink:#2c1d14;
  --ok:#3d8a2a; --ok-bg:#e4f2db;
  --bad:#c43c28; --bad-bg:#f9e1dc;
  --display:"GFS Didot","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Comfortaa","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
/* Σκοτεινό: βαθύ πορφυρό με χρυσό */
:root[data-theme="dark"]{
  --bg:#1a1020; --bg2:#26172e; --bg3:#33203d;
  --gold:#d9a945; --gold-soft:#f0cf86; --title:#d9a945;
  --cream:#f6ecd9; --muted:#bfa9c2; --off:#56405f;
  --line:rgba(217,169,69,.38);
  --parch:#f3e6c8; --ink:#2c1d14;
  --ok:#8cc970; --ok-bg:#20331c;
  --bad:#ec6a55; --bad-bg:#3b1a1a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 -6px}
.allunits{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg2);color:var(--cream);font-weight:700;font-size:.86rem;text-decoration:none}
.allunits:hover{border-color:var(--gold)}
.theme{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--bg2);cursor:pointer;font-size:1.15rem}
html{transition:background .2s}
.band{height:12px;background:
  repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 12px,#8d5a9e 12px 22px,transparent 22px 24px);opacity:.8;border-radius:2px}
.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;font-weight:700;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,9vw,3.2rem);line-height:1.05;color:var(--title);margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;color:var(--gold-soft);text-wrap:balance}
.hero{display:grid;gap:10px;padding:20px 0 22px;text-align:center}
.hero p{margin:0 auto;color:var(--muted);max-width:38ch}
.missions{display:grid;gap:12px}
.mission{display:flex;gap:14px;align-items:center;text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .15s;width:100%}
.mission:hover{border-color:var(--gold)}
.mission:active{transform:scale(.98)}
.mission .ico{font-size:1.8rem;width:56px;height:56px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px var(--bg2),0 0 0 6px var(--line)}
.mission .txt{display:grid;gap:2px;flex:1;min-width:0}
.mission .ttl{font-weight:700;font-size:1.03rem}
.mission .sub{font-size:.82rem;color:var(--muted)}
.mission .stars{font-size:1.05rem;letter-spacing:2px;color:var(--gold);flex:none}
.mission .stars .off{color:var(--off)}
.mission.special{background:var(--bg3)}
.mission.special .ico{background:#8d5a9e}
.foot{margin-top:22px;text-align:center;font-size:.78rem;color:var(--muted)}

.top{display:flex;align-items:center;gap:12px}
.x{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--bg2);cursor:pointer;font-size:1.1rem;flex:none}
.bar{flex:1;height:12px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold-soft);flex:none;font-size:.95rem}
.kind{text-align:center;margin-top:16px}
.kind span{display:inline-block;padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--gold-soft)}
.medal{width:104px;height:104px;border-radius:50%;margin:14px auto 8px;background:var(--gold);display:grid;place-items:center;font-size:3.1rem;line-height:1;box-shadow:0 0 0 6px var(--bg),0 0 0 9px var(--gold),0 0 0 14px var(--bg),0 0 0 15px var(--line)}
.medal.pop{animation:pop .5s ease}.medal.shake{animation:shake .45s ease}
@keyframes pop{40%{transform:scale(1.15) rotate(-6deg)}100%{transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.q{font-size:clamp(1.12rem,4.6vw,1.38rem);font-weight:700;text-align:center;line-height:1.45;text-wrap:balance;margin:12px 0 0}
.src{margin:14px auto 0;background:var(--parch);box-shadow:0 1px 0 var(--line);color:var(--ink);border-radius:12px;padding:14px 16px;font-family:var(--display);font-size:1.15rem;line-height:1.45;border-left:6px solid var(--gold);max-width:520px}
.src small{display:block;font-family:var(--body);font-size:.78rem;color:#6b5240;margin-top:6px}
.stmt{margin:14px auto 0;background:var(--bg2);border:2px dashed var(--line);border-radius:14px;padding:14px 16px;text-align:center;font-weight:700;font-size:1.08rem;max-width:520px}
.opts{display:grid;gap:10px;margin-top:18px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{min-height:56px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.opts.tf .opt{justify-content:center;font-weight:700;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .k{width:30px;height:30px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;color:var(--gold-soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.5}
.fb{margin-top:16px;background:var(--parch);border:1.5px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 16px;animation:rise .3s ease}
.fb b{display:block;font-size:1.05rem;margin-bottom:4px}
.fb.good b{color:#3d7a26}.fb.bad b{color:#b03a28}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.next{display:block;width:100%;margin-top:16px;padding:15px;border-radius:14px;border:none;background:var(--gold);color:#2a1a0c;font-weight:700;font-size:1.05rem;cursor:pointer}
.next:active{transform:scale(.98)}
.next.ghost{background:transparent;border:2px solid var(--line);color:var(--cream)}

/* Σειρά */
.slots{display:grid;gap:8px;margin-top:16px}
.slot{min-height:48px;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--muted);font-size:.92rem}
.slot.full{border-style:solid;background:var(--bg3);color:var(--cream);cursor:pointer}
.slot .n{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#2a1a0c;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.slot.right{border-color:var(--ok);background:var(--ok-bg)}
.slot.wrong{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.chip{padding:10px 14px;border-radius:99px;border:2px solid var(--line);background:var(--bg2);cursor:pointer;font-size:.92rem}
.chip:hover{border-color:var(--gold)}
.hint{text-align:center;font-size:.8rem;color:var(--muted);margin-top:10px}

/* Αντιστοίχιση */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:16px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);cursor:pointer;font-size:.88rem;text-align:left;min-height:52px}
.mi.l{font-weight:700}
.mi.sel{border-color:var(--gold);background:var(--bg3)}
.mi.done{border-color:var(--ok);background:var(--ok-bg);cursor:default;opacity:.85}
.mi.shake{animation:shake .4s ease;border-color:var(--bad)}

/* Ταξινόμηση */
.sortcard{margin:16px auto 0;max-width:520px;background:var(--bg2);border:2px solid var(--gold);border-radius:14px;padding:16px;text-align:center;font-weight:700;font-size:1.05rem;min-height:60px;animation:rise .25s ease}
.sortcard.empty{border-style:dashed;color:var(--muted);font-weight:500}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.bin{border:2px solid var(--line);border-radius:14px;background:var(--bg2);padding:10px;min-height:90px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;width:100%}
.bin:hover:not(:disabled){border-color:var(--gold)}
.bin h3{margin:0 0 6px;font-size:.95rem;color:var(--gold-soft);text-align:center}
.bin ul{margin:0;padding-left:16px;font-size:.8rem;color:var(--muted)}
.bin.ok{border-color:var(--ok);background:var(--ok-bg)}
.bin.shake{animation:shake .4s ease;border-color:var(--bad)}
.bin:disabled{cursor:default}

/* Αποτελέσματα */
.result{text-align:center;padding-top:10px}
.big-stars{font-size:2.6rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.big-stars .off{color:var(--off)}
.score{font-size:1.1rem;color:var(--muted)}
.review{margin-top:18px;text-align:left;display:grid;gap:8px}
.review div{background:var(--bg2);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;font-size:.88rem}
.review div b{color:var(--gold-soft)}
</style>
<style>
html.locked .wrap{display:none}
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:var(--bg);z-index:50}
.gate form{width:100%;max-width:360px;background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:24px 20px;text-align:center;display:grid;gap:12px;font-family:var(--body);color:var(--cream)}
.gate .lock{font-size:2.6rem;line-height:1}
.gate h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--title)}
.gate p{margin:0;color:var(--muted);font-size:.9rem}
.gate input{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--cream);text-align:center}
.gate input:focus{outline:none;border-color:var(--gold)}
.gate button{font:inherit;font-weight:700;font-size:1.05rem;padding:13px;border:none;border-radius:12px;background:var(--gold);color:#2a1a0c;cursor:pointer}
.gate .err{color:#c43c28;font-size:.88rem;min-height:1.2em}
.gate form.shake{animation:gshake .4s ease}
@keyframes gshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
<script>
(function(){
  var OK=["1nfdknm","1k79kra"], KEY="istoria-e-ok";
  function h(s){s=s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");var x=2166136261;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0}return x.toString(36)}
  var ok=false;try{ok=OK.indexOf(localStorage.getItem(KEY))>=0}catch(e){}
  if(ok)return;
  document.documentElement.classList.add("locked");
  document.addEventListener("DOMContentLoaded",function(){
    var g=document.createElement("div");g.className="gate";
    g.innerHTML='<form autocomplete="off"><div class="lock">🔒</div><h2>Ιστορία Ε΄</h2><p>Γράψε τον κωδικό της τάξης για να μπεις.</p><input type="password" aria-label="Κωδικός" autofocus><div class="err" aria-live="polite"></div><button type="submit">Μπες →</button></form>';
    document.body.appendChild(g);
    var f=g.querySelector("form"),inp=g.querySelector("input"),err=g.querySelector(".err");
    inp.focus();
    f.addEventListener("submit",function(ev){
      ev.preventDefault();
      var v=h(inp.value);
      if(OK.indexOf(v)>=0){try{localStorage.setItem(KEY,v)}catch(e){}g.remove();document.documentElement.classList.remove("locked");window.scrollTo(0,0)}
      else{err.textContent="Λάθος κωδικός. Δοκίμασε ξανά!";f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");inp.select()}
    });
  });
})();
</script>

"Ποιοι ήταν οι «ανθύπατοι»;":["Ανώτεροι Ρωμαίοι κυβερνήτες επαρχιών","Οι έφιπποι αγγελιοφόροι του κράτους","Οι ιερείς που φρόντιζαν το Πάνθεο","Οι αρχηγοί των ρωμαϊκών λεγεώνων"],
"Για να κρατήσουν την τάξη στην αυτοκρατορία, οι Ρωμαίοι ανέβασαν πολύ τους φόρους.":["Μείωσαν τους φόρους και οργάνωσαν την είσπραξη","Κατάργησαν τους φόρους για όλους τους πολίτες","Έβαλαν βαριούς φόρους μόνο στους Έλληνες"],
"Τι ήταν η «ρωμαϊκή ειρήνη» (pax romana);":["200 περίπου χρόνια τάξης και ασφάλειας","Μια συνθήκη ειρήνης με τους Πέρσες","Μια μεγάλη γιορτή κάθε χρόνο στη Ρώμη","Ο ναός της θεάς Ειρήνης στη Ρώμη"],
"Γιατί οι Ρωμαίοι έφτιαξαν ένα πυκνό δίκτυο δρόμων;":["Για να φτάνουν γρήγορα στρατός και έμποροι","Για να κάνουν αγώνες δρόμου και αρμάτων","Για να μη φεύγουν οι κάτοικοι από τα χωριά","Για να στολίσουν τις πόλεις της αυτοκρατορίας"],
"Από πού ως πού πήγαινε η Εγνατία Οδός;":["Από το Δυρράχιο ως το Βυζάντιο","Από τη Ρώμη ως την Αθήνα","Από τη Θεσσαλονίκη ως τη Σπάρτη","Από την Πέλλα ως την Κόρινθο"],
"Τι έκανε ο ρωμαϊκός στρατός σε καιρό ειρήνης;":["Έφτιαχνε δρόμους, γέφυρες και λιμάνια","Ξεκουραζόταν στα στρατόπεδα της Ρώμης","Έπαιζε σε αγώνες στο Κολοσσαίο","Μάζευε τους φόρους από τους αγρότες"],
"Πώς μετέφεραν τόσο γρήγορα την κρατική αλληλογραφία οι Ρωμαίοι;":["Αγγελιοφόροι άλλαζαν άλογα σε σταθμούς","Με εκπαιδευμένα ταχυδρομικά περιστέρια","Με γρήγορα πλοία σε όλη τη Μεσόγειο","Με φωτιές από λόφο σε λόφο"],
"Πού συνέχισαν οι Ρωμαίοι τις κατακτήσεις τους, τους τρεις αιώνες μετά την υποταγή της Ελλάδας;":["Δύση, Ανατολή και Βόρεια Αφρική","Μόνο στην Ελλάδα και στα νησιά","Μόνο στη Βόρεια Ευρώπη","Ινδία, Κίνα και Ιαπωνία"],
"Ποια θέση είχε ο αυτοκράτορας στη ρωμαϊκή αυτοκρατορία;":["«Πρώτος πολίτης», με πίστη και υπακοή όλων","Ένας από τους πολλούς άρχοντες της Ρώμης","Εκλεγόταν από τον λαό κάθε χρόνο","Ο αρχιερέας του ναού του Δία"],
"Στη ρωμαϊκή αυτοκρατορία όλοι μιλούσαν την ίδια γλώσσα και είχαν την ίδια θρησκεία.":["Ζούσαν λαοί με διαφορετικές γλώσσες και θρησκείες","Όλοι μιλούσαν ελληνικά και λάτρευαν τον Δία","Όλοι μιλούσαν λατινικά και ήταν χριστιανοί"],
"Ποιοι χρησιμοποιούσαν κυρίως τους ρωμαϊκούς δρόμους;":["Ο στρατός, οι έμποροι και οι αγγελιοφόροι","Ο αυτοκράτορας και η οικογένειά του","Οι προσκυνητές και οι ιερείς","Οι αθλητές και οι μονομάχοι"],
"Σε τι βοηθούσε τον αυτοκράτορα η γρήγορη μεταφορά της αλληλογραφίας;":["Μάθαινε γρήγορα τα νέα των επαρχιών","Έστελνε δώρα στους φίλους του","Διασκέδαζε τον λαό με ιστορίες","Πουλούσε γράμματα στους εμπόρους"],
"Η Ρώμη δεν είναι παραθαλάσσια. Γιατί λοιπόν ο Τίβερης ήταν τόσο σημαντικός;":["Ήταν πλωτός και ένωνε την πόλη με τη θάλασσα","Είχε το πιο καθαρό νερό του κόσμου","Προστάτευε την πόλη σαν φυσικό τείχος","Δίπλα του γίνονταν οι μονομαχίες"],
"Ποιοι φρόντιζαν τα μεγάλα αγροκτήματα των πλουσίων;":["Οι δούλοι","Οι στρατιώτες","Οι ίδιοι οι ιδιοκτήτες","Οι μικροέμποροι"],
"Τι έκαναν συνήθως τα παιδιά των μικρών αγροτών;":["Έφευγαν για στρατό, πόλη ή δημόσια έργα","Γίνονταν όλα μονομάχοι στη Ρώμη","Πήγαιναν να σπουδάσουν στην Αθήνα","Αγόραζαν τα κτήματα των γειτόνων"],
"Γιατί οι αυτοκράτορες πρόσφεραν «άρτο και θεάματα»;":["Για να μην ξεσηκώνεται ο λαός","Γιατί περίσσευαν πολλά τρόφιμα","Για να γιορτάσουν τα γενέθλιά τους","Για να μαθαίνει ο λαός ιστορία"],
"Ποιοι ζούσαν στη ρωμαϊκή ύπαιθρο;":["Γεωργοί, βοσκοί, τεχνίτες, μικροέμποροι","Μόνο στρατιώτες και αξιωματικοί","Μόνο οι πλούσιοι με τους δούλους τους","Μόνο ιερείς και μοναχοί"],
"Τι υπήρχε σε ένα μεγάλο ρωμαϊκό αγρόκτημα;":["Στάβλοι, ορνιθώνες και αποθήκες","Ένα θέατρο και ένα στάδιο","Ένα λιμάνι με φορτηγίδες","Ένας ναός και ένα σχολείο"],
"Πώς ζούσαν οι μικροϊδιοκτήτες της υπαίθρου;":["Δούλευαν μόνοι τους και είχαν λίγα","Είχαν πολλούς δούλους για τα χωράφια","Ήταν πλούσιοι και ζούσαν σε έπαυλεις","Νοίκιαζαν τη γη τους και ζούσαν στη Ρώμη"],
"Γιατί πήγαιναν συχνά στη Ρώμη πλούσιοι και φτωχοί;":["Για τις μεγάλες γιορτές και τους αγώνες","Για να πληρώσουν τους φόρους τους","Για να γραφτούν στον ρωμαϊκό στρατό","Για να πουλήσουν τα ζώα τους"],
"Μετά από κάθε μονομαχία, ο νικητής πήγαινε σπίτι του να ξεκουραστεί.":["Το πλήθος ζητούσε αμέσως νέο, ξεκούραστο αντίπαλο","Ο νικητής έπαιρνε δώρο ένα χωράφι στην ύπαιθρο","Ο νικητής γινόταν αμέσως αξιωματικός του στρατού"],
"Τι κράτησαν οι Έλληνες, παρόλο που ήταν υπόδουλοι στους Ρωμαίους;":["Τη γλώσσα, τη θρησκεία και τα έθιμά τους","Τον στρατό και τα τείχη των πόλεών τους","Τις συμμαχίες και τα πολιτεύματά τους","Τους θησαυρούς και τα έργα τέχνης τους"],
// ---------- Ενότητα Β΄ ----------
"Ποιοι γειτονικοί λαοί παραβίαζαν τα σύνορα της αυτοκρατορίας τον 3ο αιώνα μ.Χ.;":["Οι Γότθοι και οι Πέρσες","Οι Άραβες και οι Βούλγαροι","Οι Ούννοι και οι Άβαροι","Οι Σλάβοι και οι Ρώσοι"],
"Ποιο πρόβλημα δημιουργούσε ο στρατός, που είχε γίνει παντοδύναμος;":["Όριζε και καθαιρούσε αυτοκράτορες","Αρνιόταν να φυλάξει τα σύνορα του βορρά","Ζητούσε να γίνει πρωτεύουσα η Αθήνα","Ήταν πολύ μικρός για τόσο μεγάλο κράτος"],
"Τι ήταν η τετραρχία;":["Τέσσερις περιφέρειες με τέσσερις άρχοντες","Τέσσερις αυτοκράτορες μαζί στη Ρώμη","Ένας νόμος με τέσσερα βασικά άρθρα","Τέσσερις λεγεώνες γύρω από τη Ρώμη"],
"Η τετραρχία κράτησε πολλούς αιώνες.":["Όχι· μετά τον Διοκλητιανό οι τετράρχες συγκρούστηκαν","Όχι· την κατάργησαν οι Γότθοι μέσα σε έναν χρόνο","Ναι· κράτησε ως την άλωση της Πόλης"],
"Τι αποφάσισαν ο Κωνσταντίνος και ο Λικίνιος με το Διάταγμα των Μεδιολάνων (313 μ.Χ.);":["Ο καθένας λατρεύει όποιον θεό θέλει","Όλοι πρέπει να γίνουν χριστιανοί","Απαγορεύεται η λατρεία του Χριστού","Κλείνουν όλοι οι αρχαίοι ναοί"],
"Πώς έγινε ο Κωνσταντίνος μονοκράτορας;":["Νίκησε τον Λικίνιο (324 μ.Χ.)","Τον όρισε ο Διοκλητιανός","Τον ψήφισαν οι Ρωμαίοι πολίτες","Νίκησε τους Γότθους στον Δούναβη"],
"Γιατί οι ιστορικοί ονόμασαν τον Κωνσταντίνο «Μέγα»;":["Για τις τολμηρές και ωφέλιμες αποφάσεις του","Για τις νίκες του στους Ολυμπιακούς αγώνες","Γιατί ήταν ο πιο ψηλός αυτοκράτορας","Γιατί έχτισε το Κολοσσαίο της Ρώμης"],
"Πόσο κράτησε περίπου η περίοδος ακμής της ρωμαϊκής αυτοκρατορίας;":["Περίπου δύο αιώνες","Περίπου δέκα χρόνια","Περίπου χίλια χρόνια","Περίπου πέντε αιώνες"],
"Τι έκαναν κάποιες ακριτικές επαρχίες της Ανατολής τον 3ο αιώνα;":["Αποσχίστηκαν και έγιναν κράτη","Ζήτησαν να γίνουν πρωτεύουσα","Ενώθηκαν με τις επαρχίες της Δύσης","Παραδόθηκαν στους Γότθους"],
"Τι προκαλούσαν οι σκληροί διωγμοί κατά των χριστιανών;":["Δυσαρέσκεια και διχασμό στην αυτοκρατορία","Ενότητα όλων γύρω από τον αυτοκράτορα","Εξάπλωση της λατρείας των αρχαίων θεών","Ειρήνη στα σύνορα με τους Πέρσες"],
"Τι πέτυχε στην αρχή η τετραρχία;":["Τάξη μέσα στο κράτος και ασφάλεια στα σύνορα","Τον εμφύλιο ανάμεσα σε Ανατολή και Δύση","Την επικράτηση του Χριστιανισμού","Τη μεταφορά της πρωτεύουσας"],
"Τι έκανε ο Κωνσταντίνος με τον στρατό;":["Τον αναδιοργάνωσε","Τον μοίρασε σε τέσσερα κομμάτια","Τον αντικατέστησε με Γότθους","Τον μετέφερε όλο στη Ρώμη"],
"Συμβαίνει και σήμερα αυτό που όριζε το Διάταγμα των Μεδιολάνων;":["Ναι, η θρησκευτική ελευθερία είναι δικαίωμα","Όχι, σήμερα όλοι έχουν την ίδια θρησκεία","Όχι, σήμερα απαγορεύονται οι θρησκείες","Ισχύει μόνο στην πόλη του Μιλάνου"],
"Γιατί ήταν δύσκολο να κυβερνά ο Κωνσταντίνος την αυτοκρατορία από τη Ρώμη;":["Ήταν μακριά από τα σύνορα με τις επιδρομές","Είχε καταστραφεί από μεγάλο σεισμό","Δεν είχε καθόλου νερό για τους κατοίκους","Δεν είχε τείχη για να προστατευτεί"],
"Τι ήταν το Βυζάντιο πριν γίνει πρωτεύουσα;":["Αρχαία ελληνική αποικία","Ρωμαϊκό στρατόπεδο","Περσική πόλη","Έρημο νησί"],
"Ποιο ήταν το μεγάλο πλεονέκτημα της θέσης της Κωνσταντινούπολης;":["Ήταν σταυροδρόμι στεριάς και θάλασσας","Ήταν χτισμένη πάνω σε ψηλό βουνό","Ήταν πολύ κοντά στη Ρώμη","Είχε τα πιο εύφορα χωράφια"],
"Τι πολύτιμα προϊόντα έρχονταν από την Ανατολή;":["Μπαχαρικά, μετάξι, αρώματα","Πατάτες, ντομάτες, καλαμπόκι","Καφές, σοκολάτα, ζάχαρη","Χαρτί, γυαλιά, ρολόγια"],
"Ποια ήταν η μητέρα του Κωνσταντίνου;":["Η Ελένη","Η Θεοδώρα","Η Ευδοκία","Η Ειρήνη"],
"Ποια πλοία περνούσαν από το Βυζάντιο;":["Όσα πήγαιναν από το Αιγαίο στον Εύξεινο","Μόνο τα πολεμικά πλοία της Ρώμης","Μόνο όσα πήγαιναν στην Αίγυπτο","Μόνο ψαροκάικα της Προποντίδας"],
"Ποιοι ακολούθησαν τον αυτοκράτορα στη νέα πρωτεύουσα;":["Χιλιάδες Ρωμαίοι κάθε επαγγέλματος","Μόνο η οικογένεια και οι φρουροί του","Μόνο οι επίσκοποι και οι ιερείς","Μόνο οι μονομάχοι του Κολοσσαίου"],
"Οι Ρωμαίοι ανάγκασαν τους Έλληνες της νέας πρωτεύουσας να μιλούν λατινικά.":["Όχι· αντίθετα βοήθησαν να διαδοθούν τα ελληνικά","Όχι· τους ανάγκασαν να μιλούν μόνο περσικά","Ναι· απαγόρευσαν τα ελληνικά στα σχολεία"],
"Ποιες θάλασσες περιβάλλουν την Κωνσταντινούπολη;":["Προποντίδα, Βόσπορος, Κεράτιος κόλπος","Αιγαίο, Ιόνιο, Κρητικό πέλαγος","Αδριατική, Τυρρηνικό, Ιόνιο","Εύξεινος, Κασπία, Ερυθρά Θάλασσα"],
"Πού είχε πρωτοδιδαχτεί και ριζώσει ο Χριστιανισμός;":["Στις ανατολικές περιοχές","Στη Ρώμη και την Ιταλία","Στη Γαλλία και την Ισπανία","Στη Βρετανία και τη Γερμανία"],
"Σε σχέση με τη Ρώμη, ποιο πλεονέκτημα είχε η Κωνσταντινούπολη για την άμυνα της αυτοκρατορίας;":["Ήταν πιο κοντά στα απειλούμενα σύνορα","Ήταν πιο κοντά στη Βρετανία και τη Γαλλία","Είχε περισσότερους ναούς και θέατρα","Ήταν μακριά από κάθε θάλασσα"],
"Ποιο μειονέκτημα είχε το Βυζάντιο από τη μεριά της στεριάς, σύμφωνα με τον Πολύβιο;":["Οι Θράκες λεηλατούσαν τη σοδειά","Δεν είχε καθόλου πόσιμο νερό","Γινόταν συχνά μεγάλοι σεισμοί","Ήταν γεμάτο βάλτους και κουνούπια"],
"Τι υψώθηκε στη μεγάλη αγορά, στο κέντρο της Πόλης;":["Στήλη με το άγαλμα του αυτοκράτορα","Ένας ψηλός φάρος για τα πλοία","Ένα άγαλμα του Δία από χρυσό","Τα τέσσερα άλογα του Λυσίππου"],
"Πώς στόλισαν τις πλατείες και τους δημόσιους χώρους;":["Με έργα τέχνης από όλη την αυτοκρατορία","Με ψηφιδωτά που έφτιαξαν μόνο Πέρσες","Μόνο με κήπους και σπάνια λουλούδια","Με εικόνες του Χριστού και των αγίων"],
"Οι τεράστιες δεξαμενές της Πόλης είχαν νερό για έξι μήνες. Γιατί ήταν τόσο χρήσιμο αυτό;":["Θα είχαν νερό και σε πολιορκία","Για να γεμίζουν τις πισίνες των πλουσίων","Για να κάνουν ναυμαχίες στον ιππόδρομο","Γιατί στην Πόλη δεν έβρεχε ποτέ"],
"Τι έκανε ο Κωνσταντίνος για να προστατέψει την Πόλη;":["Επισκεύασε τα παλιά τείχη και έχτισε νέα","Έσκαψε ένα βαθύ κανάλι γύρω από την Πόλη","Έφερε όλες τις λεγεώνες από τη Ρώμη","Έκλεισε με αλυσίδα τον Βόσπορο"],
"Τι έδωσε ο Κωνσταντίνος σε όσους φρόντιζαν τα τείχη και την ασφάλεια της Πόλης;":["Τίτλους, προνόμια και κίνητρα","Μια θέση στο ιερό παλάτι","Χωράφια στη Θράκη και στη Βιθυνία","Τίποτα, ήταν υποχρέωσή τους"],
"Ποια έργα της εποχής σώζονται ακόμη σήμερα στην Πόλη, όπως δείχνουν οι εικόνες του βιβλίου;":["Κομμάτια των τειχών και το υδραγωγείο","Η στήλη με το άγαλμα του Κωνσταντίνου","Το ιερό παλάτι με τους κήπους του","Οι ναοί της παλιάς θρησκείας"],
"Τι κατάλαβαν οι αυλικοί όταν ο Κωνσταντίνος είπε ότι θα σταματήσει όταν σταματήσει «αυτός που προχωρεί μπροστά» του;":["Ότι τον οδηγούσε μια θεία δύναμη","Ότι ακολουθούσε τον αρχιτέκτονα","Ότι είχε κουραστεί και αστειευόταν","Ότι ακολουθούσε έναν στρατιώτη"],
"Γιατί, κατά τον θρύλο, ο Κωνσταντίνος σκέφτηκε πρώτα την Τροία;":["Ήταν η πόλη του Αινεία, γενάρχη των Ρωμαίων","Είχε το μεγαλύτερο λιμάνι της Ανατολής","Ήταν η πατρίδα της μητέρας του, Ελένης","Εκεί είχε νικήσει τον Λικίνιο"],
"Πότε βαπτίστηκε χριστιανός ο Κωνσταντίνος;":["Λίγο πριν από τον θάνατό του","Τη χρονιά του Διατάγματος (313 μ.Χ.)","Τη μέρα των εγκαινίων της Πόλης","Στη Σύνοδο της Νίκαιας (325 μ.Χ.)"],
"Γιατί ο Ιουλιανός θαύμαζε την αρχαία θρησκεία;":["Σπούδασε αρχαία φιλοσοφία στην Αθήνα","Μεγάλωσε στους Δελφούς με ιερείς","Τον επηρέασαν οι Πέρσες σύμμαχοί του","Τον δίδαξε ο Μέγας Βασίλειος"],
"Για τι παραπονιέται ο φιλόσοφος Λιβάνιος στον Θεοδόσιο;":["Για καταστροφές αρχαίων ναών","Για τους υψηλούς φόρους στους φιλοσόφους","Για το κλείσιμο του ιπποδρόμου","Για τις επιδρομές των Γότθων"],
"Ποιοι είναι οι Τρεις Ιεράρχες;":["Βασίλειος, Γρηγόριος, Ιωάννης Χρυσόστομος","Κωνσταντίνος, Θεοδόσιος, Ιουστινιανός","Ανθέμιος, Ισίδωρος, Τριβωνιανός","Πλάτωνας, Σωκράτης, Αριστοτέλης"],
"Γιατί δεν πέτυχαν τα μέτρα του Ιουλιανού;":["Ο λαός είχε στραφεί πια στη νέα θρησκεία","Τον σταμάτησαν οι Γότθοι στον Δούναβη","Τα ακύρωσε η Σύνοδος της Νίκαιας","Δεν πρόλαβε να τα ανακοινώσει"],
"Πώς ονόμαζαν οι χριστιανοί τους πιστούς της παλιάς θρησκείας;":["Εθνικούς","Ρωμαίους","Βαρβάρους","Ιεράρχες"],
"Πώς επικράτησε τελικά ο Χριστιανισμός;":["Με τη διδασκαλία των Πατέρων της Εκκλησίας","Μόνο με νόμους και τιμωρίες","Με τη βοήθεια των Περσών","Με μια νίκη στα Καταλαυνικά Πεδία"],
"Πώς ονόμασαν οι χριστιανοί τον Ιουλιανό;":["«Παραβάτη»","«Μέγα»","«Ισαπόστολο»","«Χρυσόστομο»"],
"Γιατί ο Θεοδόσιος μοίρασε την αυτοκρατορία στους δύο γιους του;":["Για να κυβερνιέται καλύτερα","Επειδή μάλωναν οι δύο γιοι","Επειδή το απαίτησαν οι Γότθοι","Για να καταργήσει τη Ρώμη"],
"Πώς προστάτευσαν οι αυτοκράτορες της Ανατολής το κράτος τους;":["Με τείχη, φρουρές και συμφωνίες","Με συμμαχία με το Δυτικό κράτος","Με μεταφορά της πρωτεύουσας","Με πόλεμο εναντίον της Ρώμης"],
"Τι ένωνε τους κατοίκους του Ανατολικού κράτους, αν και ανήκαν σε διαφορετικά έθνη;":["Νόμος, θρησκεία και ελληνική γλώσσα","Η λατινική γλώσσα και ο στρατός","Οι ιπποδρομίες και οι Δήμοι","Οι Ολυμπιακοί αγώνες"],
"Τι μας δείχνει αυτό για το Πανδιδακτήριο, που ίδρυσαν ο Θεοδόσιος Β΄ και η Ευδοκία;":["Τα ελληνικά έπαιρναν επίσημη θέση","Κανείς δεν ήξερε πια λατινικά","Οι καθηγητές ήταν όλοι Ρωμαίοι","Τα ελληνικά είχαν απαγορευτεί"],
"Πού έφτασαν οι Βάνδαλοι;":["Στη βόρεια Αφρική, στην Καρχηδόνα","Στην Κωνσταντινούπολη","Στην Ελλάδα και την Κρήτη","Στη Ραβέννα της Ιταλίας"],
"Ποιοι μετακινούμενοι λαοί απειλούσαν τα βόρεια σύνορα στα χρόνια του Θεοδόσιου;":["Ούννοι, Γότθοι, Βάνδαλοι","Άραβες, Πέρσες, Αιγύπτιοι","Φράγκοι, Βενετοί, Τούρκοι","Σλάβοι, Βούλγαροι, Ρώσοι"],
"Ποια ήταν η Ευδοκία;":["Η Ελληνίδα σύζυγος του Θεοδόσιου Β΄","Η μητέρα του Μεγάλου Κωνσταντίνου","Η σύζυγος του Ιουστινιανού","Η κόρη του αρχηγού των Γότθων"],
"Τι υπήρχε μέσα στο παλάτι, εκτός από το σπίτι του αυτοκράτορα;":["Κρατικές υπηρεσίες, αίθουσες, εκκλησίες","Ο ιππόδρομος και το Κολοσσαίο","Το Πανδιδακτήριο και η Βιβλιοθήκη","Η μεγάλη αγορά και το λιμάνι"],
"Τι έκαναν οι θεατές στον ιππόδρομο, εκτός από το να βλέπουν αγώνες;":["Έλεγαν στον αυτοκράτορα αιτήματα και παράπονα","Ψήφιζαν τους νέους νόμους του κράτους","Διάλεγαν τον επόμενο αυτοκράτορα","Πλήρωναν εκεί τους φόρους τους"],
"Πού ήταν χτισμένο το παλάτι;":["Σε λόφο πάνω από τον Βόσπορο","Σε νησί μέσα στην Προποντίδα","Μέσα στη μεγάλη αγορά","Έξω από τα τείχη της Πόλης"],
"Με τι ήταν στολισμένοι οι κήποι και οι αυλές του παλατιού;":["Κρήνες, ψηφιδωτά και σπάνια φυτά","Αγάλματα μονομάχων από τη Ρώμη","Τα τέσσερα άλογα του Λυσίππου","Πολεμικά λάφυρα από τους Πέρσες"],
"Τι είναι οι «κερκίδες»;":["Σειρές καθισμάτων","Τα άρματα των αγώνων","Οι στολές των Δήμων","Τα δώρα των νικητών"],
"Πότε γίνονταν έκτακτες ιπποδρομίες;":["Σε χαρμόσυνα γεγονότα ή για ξένους άρχοντες","Κάθε φορά που ξεσηκωνόταν ο λαός","Όταν πέθαινε ένας αυτοκράτορας","Όταν νικούσαν οι Πράσινοι"],
"Από πού έφερε ο Θεοδόσιος Α΄ τα χάλκινα άλογα του Λυσίππου (390 μ.Χ.);":["Από τη Χίο","Από τη Ρώμη","Από την Αθήνα","Από τη Βενετία"],
"Γιατί φιλονικούσαν συχνά οι Δήμοι μεταξύ τους;":["Για τη νίκη της ομάδας τους","Για τα χωράφια έξω από την Πόλη","Για θρησκευτικά ζητήματα","Για το ποιος θα γίνει αυτοκράτορας"],
"Ποια ζώα έφερναν στον ιππόδρομο όταν γινόταν τσίρκο;":["Λιοντάρια, αρκούδες, ονάγρους","Ελέφαντες, καμήλες, ρινόκερους","Δελφίνια, φώκιες, χελώνες","Ταύρους, κριάρια, κατσίκες"],
"Γιατί πολλοί έλεγαν την Κωνσταντινούπολη «Επτάλοφη»;":["Ήταν χτισμένη σε επτά λόφους","Είχε επτά μεγάλες πύλες","Την έχτισαν επτά αυτοκράτορες","Είχε επτά λιμάνια"],
"Ποια ήταν τα κέντρα ζωής των πολιτών και της Πόλης;":["Οι αγορές και το λιμάνι","Τα σχολεία και τα μοναστήρια","Τα στρατόπεδα και τα τείχη","Το παλάτι και τα λουτρά"],
"Γιατί πήγαινε πολύς κόσμος στις υπαίθριες αγορές;":["Είχαν καλύτερες τιμές","Ήταν ανοιχτές όλη νύχτα","Ήταν υποχρεωτικό","Μοίραζαν δωρεάν ψωμί"],
"Ο Έπαρχος της Πόλης είχε εξουσία μόνο μέσα στα τείχη.":["Είχε εξουσία και 100 χιλιόμετρα γύρω από την Πόλη","Είχε εξουσία σε όλη την αυτοκρατορία","Είχε εξουσία μόνο στο λιμάνι και στις αγορές"],
"Τι όρισε ο Κωνσταντίνος για τα σπίτια και τα κτίρια της Πόλης;":["Να μην κρύβουν τη θέα των γειτόνων","Να είναι όλα βαμμένα κόκκινα","Να έχουν όλα κήπο με κρήνη","Να είναι όλα μονώροφα"],
"Τι έκαναν οι Βυζαντινοί στα πανηγύρια, μετά τη θεία λειτουργία;":["Έτρωγαν, χόρευαν, τραγουδούσαν","Πήγαιναν όλοι στον ιππόδρομο","Έκαναν παρέλαση με τον στρατό","Νήστευαν και προσεύχονταν"],
"Από ποιον πήρε το όνομά της η μεγαλύτερη αγορά της Πόλης;":["Από τον Κωνσταντίνο","Από τον Ιουστινιανό","Από τον Βύζαντα","Από τον Θεοδόσιο"],
"Πού είχαν τα σπίτια τους οι πιο εύπορες οικογένειες;":["Στη Μέση λεωφόρο","Έξω από τα τείχη","Δίπλα στο λιμάνι","Μέσα στο παλάτι"],
"Γιατί οι υπαίθριες αγορές λέγονταν έτσι;":["Οι πωλητές δεν είχαν σταθερή στέγη","Γίνονταν μόνο τις νύχτες του καλοκαιριού","Πουλούσαν μόνο προϊόντα του αέρα","Γίνονταν πάνω σε πλοία στο λιμάνι"],
"Γιατί ένα λιμάνι είναι σημαντική πηγή πλούτου για μια πόλη;":["Εκεί γίνεται εμπόριο και υπάρχουν δουλειές","Εκεί μαζεύονται οι τουρίστες για μπάνιο","Εκεί ζουν όλοι οι πλούσιοι της πόλης","Εκεί βρίσκεται πάντα το παλάτι"],
"Στο Βυζάντιο όλα τα παιδιά πήγαιναν υποχρεωτικά σχολείο.":["Όχι· πήγαιναν μόνο αγόρια με γονείς που πλήρωναν","Όχι· πήγαιναν μόνο τα κορίτσια των πλουσίων","Όχι· δεν υπήρχε κανένα σχολείο στο Βυζάντιο"],
"Τι αποστήθιζαν οι μαθητές στις μεγαλύτερες τάξεις;":["Όμηρο, Αγία Γραφή, μύθους του Αισώπου","Τους νόμους του Ιουστινιανού","Λατινικά ποιήματα και ρωμαϊκή ιστορία","Τα ονόματα όλων των αυτοκρατόρων"],
"Τι ήταν ο «μάρσιπος»;":["Υφασμάτινος σάκος για τα σύνεργα","Χαμηλό ξύλινο σκαμνί του μαθητή","Βιβλίο με ψαλμούς για ανάγνωση","Πλάκα αλειμμένη με κερί"],
"Πάνω σε τι έγραφαν οι μικροί μαθητές;":["Σε πλάκα με κοντύλι","Σε τετράδιο με μολύβι","Σε πάπυρο με μελάνι","Σε χαρτί με φτερό"],
"Τι έκαναν τα κορίτσια, που δεν πήγαιναν σχολείο;":["Μάθαιναν να κεντούν, να πλέκουν, να υφαίνουν","Γίνονταν μαθητευόμενες κοντά σε τεχνίτες","Μάθαιναν γράμματα στα μοναστήρια","Δούλευαν στην αγορά ως πωλήτριες"],
"Τι έκαναν τα αγόρια που δεν πήγαιναν σχολείο;":["Μάθαιναν μια τέχνη δίπλα σε τεχνίτη","Γίνονταν αμέσως στρατιώτες στα σύνορα","Πήγαιναν δωρεάν στο Πανδιδακτήριο","Έπαιζαν στον ιππόδρομο με τους Δήμους"],
"Πώς πλήρωναν οι γονείς τα δίδακτρα;":["Σε είδος ή σε χρήματα","Μόνο σε χρυσά νομίσματα","Με δουλειά στο σχολείο","Δεν πλήρωναν τίποτα"],
"Τι μάθαιναν τα παιδιά στις δύο μικρότερες τάξεις;":["Γραφή, ανάγνωση και λογαριασμό","Φιλοσοφία και αστρονομία","Ιππασία και τοξοβολία","Λατινικά και νόμους"],
"Ποιο ήταν το συνηθισμένο αναγνωστικό των μαθητών;":["Το ψαλτήρι","Η Ιλιάδα","Το Ευαγγέλιο","Οι μύθοι του Αισώπου"],
"Πάνω σε τι έγραφαν με μελάνι οι μαθητές των μεγαλύτερων τάξεων;":["Σε πάπυρο, περγαμηνή και χαρτί","Σε πέτρινες πλάκες με σφυρί","Σε ξύλινες σανίδες με κάρβουνο","Σε πήλινα πλακίδια με καλάμι"],
"Ποιοι αναλάμβαναν την αγωγή των παιδιών που δεν πήγαιναν σχολείο;":["Γονείς, γιαγιάδες και παππούδες","Οι ιερείς της ενορίας","Οι δάσκαλοι του Πανδιδακτηρίου","Οι αξιωματικοί του στρατού"],
"Γιατί άντεξε το Ανατολικό κράτος, ενώ το Δυτικό διαλύθηκε;":["Ήταν οργανωμένο, οχυρό και ενωμένο","Δεν είχε κανέναν εχθρό στα σύνορα","Είχε συμμάχους τους Γότθους και τους Ούννους","Ήταν μικρότερο και πιο φτωχό"],
"Στο Βυζάντιο, όπως και σήμερα, το σχολείο ήταν δωρεάν για όλα τα παιδιά.":["Τότε πλήρωναν δίδακτρα· σήμερα είναι δωρεάν για όλους","Τότε ήταν δωρεάν μόνο για τα κορίτσια","Και τότε και σήμερα πληρώνουν όλοι δίδακτρα"],
// ---------- Ενότητα Γ΄ ----------
"Για ποια χαρίσματα ξεχώριζε ο Ιουστινιανός;":["Γνώσεις, εργατικότητα, τόλμη","Δύναμη, ομορφιά, ψηλό ανάστημα","Φωνή, μουσική, ποίηση","Πλούτο και αριστοκρατική καταγωγή"],
"Τι έκανε ο Ιουστινιανός με τους παλιούς ρωμαϊκούς νόμους;":["Τους οργάνωσε και πρόσθεσε νέους","Τους κατάργησε και έγραψε άλλους","Τους μετέφρασε στα λατινικά","Τους άφησε όπως ήταν"],
"Πώς φορολόγησε ο Ιουστινιανός τους πολίτες;":["Ανάλογα με τα εισοδήματά τους","Όλους με τον ίδιο ακριβώς φόρο","Μόνο τους αγρότες της υπαίθρου","Μόνο τους εμπόρους της Πόλης"],
"Πώς προστάτευσε τους μικρούς αγρότες;":["Δεν τους έπαιρναν τη γη για χρέη","Τους χάρισε άλογα και εργαλεία","Τους έκανε όλους στρατιώτες","Τους έφερε να ζήσουν στην Πόλη"],
"Ποιοι ήταν οι «λογοθέτες»;":["Κάτι σαν τους σημερινούς υπουργούς","Οι δάσκαλοι του Πανδιδακτηρίου","Οι αρχηγοί των Πράσινων και Βένετων","Οι ιερείς της Μεγάλης Εκκλησίας"],
"Με ποιο κριτήριο διάλεγε ο Ιουστινιανός τους συνεργάτες του;":["Με βάση τις ικανότητές τους","Με βάση την καταγωγή τους","Με βάση τον πλούτο τους","Με βάση τη συγγένεια μαζί του"],
"Ποια ήταν η «σκιερή σελίδα» του Ιουστινιανού το 529 μ.Χ.;":["Έκλεισε τη Φιλοσοφική Σχολή","Έκαψε την παλιά Αγία Σοφία","Έχασε τη Ρώμη από τους Γότθους","Κατάργησε τους Ολυμπιακούς αγώνες"],
"Ποιο ήταν το μεγάλο όνειρο του Ιουστινιανού;":["Να ξαναφτάσει στα παλιά ρωμαϊκά σύνορα","Να μεταφέρει την πρωτεύουσα στη Ρώμη","Να κατακτήσει την Περσία","Να χτίσει τείχος σε όλη τη Θράκη"],
"Τι προβλήματα είχε το κράτος όταν ανέβηκε στον θρόνο ο Ιουστινιανός;":["Κακή διοίκηση και εχθρούς στα σύνορα","Μεγάλο σεισμό και πείνα στην Πόλη","Εμφύλιο ανάμεσα σε Ανατολή και Δύση","Κανένα, ήταν η καλύτερη εποχή"],
"Τι επέβαλε ο Ιουστινιανός στα εισαγόμενα προϊόντα;":["Δασμούς","Απαγόρευση","Έκπτωση","Τίποτα"],
"Πώς οργάνωσε ο Ιουστινιανός τον στρατό;":["Με Βυζαντινούς στρατιώτες και φρούρια","Μόνο με Γότθους μισθοφόρους","Με τους οπαδούς των Δήμων","Με στρατιώτες από την Περσία"],
"Τι έκανε ο Ιουστινιανός στους δρόμους της αυτοκρατορίας;":["Τους συντήρησε και τους βελτίωσε","Τους έκλεισε για να μη μπουν εχθροί","Έφτιαξε δρόμους μόνο στην Πόλη","Δεν ασχολήθηκε καθόλου με αυτούς"],
"Ποιος ήταν ο Τριβωνιανός;":["Ο νομομαθής των νέων νόμων","Ο στρατηγός της Ανατολής","Ο αρχιτέκτονας της Αγίας Σοφίας","Ο αρχηγός των Πράσινων"],
"Πόσους αιώνες λειτουργούσε η Φιλοσοφική Σχολή της Αθήνας όταν έκλεισε;":["Εννέα αιώνες","Δύο αιώνες","Πέντε αιώνες","Δώδεκα αιώνες"],
"Γιατί ο Ιουστινιανός έκλεισε τη Φιλοσοφική Σχολή της Αθήνας;":["Τη θεωρούσε το τελευταίο καταφύγιο της αρχαίας θρησκείας","Είχε πολύ λίγους μαθητές και κόστιζε πολλά","Οι δάσκαλοί της είχαν πάρει μέρος σε στάση","Ήθελε να τη μεταφέρει στην Κωνσταντινούπολη"],
"Ποιος ήταν ο Ιωάννης Καππαδόκης;":["Ο λογοθέτης των οικονομικών","Ο αρχιτέκτονας της Αγίας Σοφίας","Ο στρατηγός της Δύσης","Ο αρχηγός των Βένετων"],
"Γιατί θύμωσαν οι Δήμοι με τον Ιουστινιανό;":["Τους έλεγξε τα έσοδα και τους πήρε προνόμια","Έκλεισε τον ιππόδρομο για πάντα","Υποστήριζε πάντα τους Πράσινους","Δεν πήγαινε ποτέ στις ιπποδρομίες"],
"Πότε ξέσπασε η «στάση του νίκα»;":["Το 532 μ.Χ.","Το 527 μ.Χ.","Το 537 μ.Χ.","Το 529 μ.Χ."],
"Τι σήμαινε το σύνθημα «νίκα»;":["Ήταν η ενθάρρυνση για τους ηνιόχους","Ήταν το όνομα του αρχηγού των Πράσινων","Σήμαινε «ζήτω ο αυτοκράτορας»","Ήταν το όνομα ενός νικητή αλόγου"],
"Τι έκαναν οι στασιαστές μέσα στην Πόλη;":["Λεηλάτησαν και έκαψαν κτίρια","Περικύκλωσαν τον ιππόδρομο","Έκαναν ειρηνική παρέλαση","Έκλεισαν τις πύλες της Πόλης"],
"Ποιον ανακήρυξαν αυτοκράτορα οι στασιαστές;":["Τον Υπάτιο","Τον Βελισάριο","Τον Ναρσή","Τον Τριβωνιανό"],
"Τι ήθελε να πει η Θεοδώρα στον Ιουστινιανό, όταν εκείνος σκεφτόταν να φύγει;":["Να μείνει, ακόμη κι αν κινδυνεύει","Να φύγουν μαζί με ένα πλοίο","Να δώσει τον θρόνο στον Υπάτιο","Να κρυφτεί μέσα στο παλάτι"],
"Γιατί λέμε ότι «κανείς δε νίκησε στη στάση του νίκα»;":["Όλοι έχασαν: ζωές, Πόλη, γόητρο","Ο αγώνας εκείνης της μέρας έληξε ισόπαλος","Και οι δύο Δήμοι αποκλείστηκαν","Η στάση σταμάτησε πριν αρχίσει"],
"Ποιοι προστέθηκαν στους στασιαστές στη διάρκεια των ταραχών;":["Δυσαρεστημένοι κάτοικοι","Στρατιώτες της φρουράς","Πέρσες πρέσβεις","Μοναχοί και ιερείς"],
"Τι σκέφτηκε για μια στιγμή να κάνει ο Ιουστινιανός;":["Να παραιτηθεί και να φύγει","Να ενωθεί με τους στασιαστές","Να καλέσει τους Πέρσες σε βοήθεια","Να κλείσει για πάντα τον ιππόδρομο"],
"Τι έγινε με τους αγώνες του ιπποδρόμου μετά τη στάση;":["Σταμάτησαν για αρκετά χρόνια","Γίνονταν πια κάθε μέρα","Μεταφέρθηκαν στη Ρώμη","Συνεχίστηκαν όπως πριν"],
"Τι ήταν η «πορφύρα»;":["Βασιλικό κόκκινο μεταξωτό ύφασμα","Το στέμμα των αυτοκρατόρων","Ο θρόνος του παλατιού","Ένα χρυσό βυζαντινό νόμισμα"],
"Ποια δύο σχέδια συνδύασαν οι αρχιτέκτονες;":["Βασιλική και περίκεντρο ναό με τρούλο","Δωρικό ναό και ρωμαϊκό αμφιθέατρο","Αιγυπτιακή πυραμίδα και πύργο","Ιππόδρομο και παλάτι"],
"Γιατί ο Ιουστινιανός ζήτησε από όλους να προσφέρουν υλικά και χρήματα;":["Για να νιώθουν όλοι τον ναό δικό τους","Γιατί δεν είχε καθόλου χρήματα το κράτος","Για να τιμωρήσει όσους πήραν μέρος στη στάση","Γιατί έτσι όριζαν οι νόμοι του Τριβωνιανού"],
"Ο Ιουστινιανός, μπαίνοντας στον ναό, ψιθύρισε «Νενίκηκά σε, Σολομών!». Τι εννοούσε;":["Ότι ξεπέρασε τον ναό του Σολομώντα","Ότι νίκησε τον στρατηγό Σολομώντα","Ότι κέρδισε τον Σολομώντα στα άρματα","Ότι νίκησε στη «στάση του νίκα»"],
"Τι εντυπωσιάζει περισσότερο τον Προκόπιο στην Αγία Σοφία;":["Ο τρούλος","Οι κολόνες","Τα παράθυρα","Η αυλή"],
"Τι γινόταν στην Αγία Σοφία στους αιώνες που ακολούθησαν;":["Στέψεις, δοξολογίες και παρακλήσεις","Ιπποδρομίες και γιορτές των Δήμων","Μαθήματα του Πανδιδακτηρίου","Συνεδριάσεις του στρατού"],
"Ποια ήταν η πρώτη φροντίδα του Ιουστινιανού μετά τη «στάση του νίκα»;":["Να ξαναχτίσει ό,τι καταστράφηκε","Να τιμωρήσει όλους τους Δήμους","Να κηρύξει πόλεμο στους Πέρσες","Να ξανανοίξει τον ιππόδρομο"],

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const save = p => { try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {} };

/* Γύρος: διαλέγει m.pick ερωτήσεις, πρώτα όσες δεν έχουν εμφανιστεί ακόμη. */
const SEEN_KEY = KEY + '-seen';
const loadSeen = () => { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; } };
function pickRound(m){
  const all = m.qs.map((_, i) => i);
  if (!m.pick || m.qs.length <= m.pick) return all;
  const seenAll = loadSeen(), seen = new Set(seenAll[m.id] || []);
  const fresh = shuffle(all.filter(i => !seen.has(i))), old = shuffle(all.filter(i => seen.has(i)));
  const chosen = fresh.concat(old).slice(0, m.pick).sort((a, b) => a - b);
  let nowSeen = new Set([...seen, ...chosen]);
  if (nowSeen.size >= all.length) nowSeen = new Set(chosen);  // κύκλος ολοκληρώθηκε: ξεκινά νέος, αποφεύγοντας όσες μόλις έπαιξε
  seenAll[m.id] = [...nowSeen];
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seenAll)); } catch (e) {}
  return chosen;
}

function start(mi, only, retry){
  const m = MISSIONS[mi];
  if (!only) only = pickRound(m);
  const list = only.map(i => m.qs[i]);
  S = {mi, m, list, idx: 0, ok: 0, missed: [], retry: !!retry, map: only};
  ask();
}

function header(){
  const n = S.list.length;
  return `<div class="top">
    <button class="x" id="quit" aria-label="Έξοδος">✕</button>
    <div class="bar"><i style="width:${(S.idx / n) * 100}%"></i></div>
    <div class="count">${S.idx + 1}/${n}</div>
  </div>`;
}

function ask(){
  const q = S.list[S.idx];
  let body = '';
  if (q.t === 'mc' || q.t === 'src') {
    S.opts = shuffle(q.a.map((t, i) => ({t, ok: i === 0})));
    body = (q.t === 'src' ? `<div class="src">${esc(q.src)}<small>— ${esc(q.who)}</small></div>` : '') +
      `<p class="q">${esc(q.q)}</p><div class="opts">${S.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  } else if (q.t === 'tf') {
    body = `<p class="q">${esc(q.q)}</p><div class="stmt">${esc(q.s)}</div>
      <div class="opts tf"><button class="opt" data-v="1">✔️ Σωστό</button><button class="opt" data-v="0">✖️ Λάθος</button></div><div id="fix"></div>`;
  } else if (q.t === 'order') {
    S.pool = shuffle(q.items.map((t, i) => ({t, i}))); S.placed = [];
    body = `<p class="q">${esc(q.q)}</p><div class="slots" id="slots"></div><div class="pool" id="pool"></div>
      <p class="hint">Πάτα με τη σειρά. Πάτα ένα κουτάκι για να το βγάλεις.</p><div id="act"></div>`;
  } else if (q.t === 'match') {
    S.L = shuffle(q.pairs.map((p, i) => ({t: p[0], i}))); S.R = shuffle(q.pairs.map((p, i) => ({t: p[1], i})));
    S.sel = null; S.done = 0; S.err = 0;
    body = `<p class="q">${esc(q.q)}</p>
      <div class="match"><div class="col">${S.L.map(o => `<button class="mi l" data-side="L" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
      <div class="col">${S.R.map(o => `<button class="mi" data-side="R" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div></div>
      <p class="hint">Πάτα μια λέξη αριστερά και μετά το ταίρι της δεξιά.</p><div id="act"></div>`;
  } else if (q.t === 'sort') {
    S.items = shuffle(q.items.map(([t, g]) => ({t, g}))); S.k = 0; S.err = 0;
    body = `<p class="q">${esc(q.q)}</p><div class="sortcard" id="sc"></div>
      <div class="bins">${q.groups.map((g, i) => `<button class="bin" data-g="${i}"><h3>${esc(g)}</h3><ul></ul></button>`).join('')}</div>
      <p class="hint">Πάτα το κουτί όπου ταιριάζει η φράση.</p>`;
  }
  app.innerHTML = header() + `<div class="kind"><span>${KIND[q.t]}</span></div>
    <div class="medal" id="medal" aria-hidden="true">${ICON[q.t]}</div>${body}`;
  document.getElementById('quit').onclick = () => { if (confirmQuit()) home(); };

  if (q.t === 'mc' || q.t === 'src') app.querySelectorAll('.opt').forEach(b => b.onclick = () => answerMC(+b.dataset.i));
  if (q.t === 'tf') app.querySelectorAll('.opt').forEach(b => b.onclick = () => answerTF(b.dataset.v === '1'));
  if (q.t === 'order') drawOrder();
  if (q.t === 'match') app.querySelectorAll('.mi').forEach(b => b.onclick = () => tapMatch(b));
  if (q.t === 'sort') { app.querySelectorAll('.bin').forEach(b => b.onclick = () => tapSort(b)); drawSort(); }
  window.scrollTo(0, 0);
}
function confirmQuit(){ return true; }

function feedback(ok, ex, extra){
  S.answered = true;
  if (ok) S.ok++; else S.missed.push(S.idx);
  const m = document.getElementById('medal');
  m.textContent = ok ? '🏅' : '🤔'; m.classList.add(ok ? 'pop' : 'shake');
  const last = S.idx === S.list.length - 1;
  app.insertAdjacentHTML('beforeend', `
    <div class="fb ${ok ? 'good' : 'bad'}"><b>${ok ? pick(GOOD) : pick(OOPS)}</b>${extra ? `<div style="margin-bottom:6px">${extra}</div>` : ''}${esc(ex)}</div>
    <button class="next" id="next">${last ? 'Δες τα αποτελέσματα' : 'Επόμενη →'}</button>`);
  const n = document.getElementById('next');
  n.onclick = () => { S.answered = false; S.idx++; S.idx < S.list.length ? ask() : results(); };
  n.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function answerMC(i){
  const q = S.list[S.idx], btns = app.querySelectorAll('.opt');
  btns.forEach((b, j) => { b.disabled = true; if (S.opts[j].ok) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); else b.classList.add('dim'); });
  feedback(S.opts[i].ok, q.ex);
}

function answerTF(v){
  const q = S.list[S.idx], btns = app.querySelectorAll('.opts.tf .opt');
  btns.forEach(b => { b.disabled = true; const bv = b.dataset.v === '1'; if (bv === q.ok) b.classList.add('right'); else if (bv === v) b.classList.add('wrong'); });
  if (v !== q.ok) { feedback(false, q.ex, q.ok ? 'Η πρόταση είναι <b style="display:inline;color:inherit">σωστή</b>.' : 'Η πρόταση είναι λάθος. Το σωστό: <b style="display:inline;color:inherit">' + esc(q.fix[0]) + '</b>'); return; }
  if (q.ok) { feedback(true, q.ex); return; }
  // Σωστά βρήκε ότι είναι λάθος: τώρα να το διορθώσει.
  S.opts = shuffle(q.fix.map((t, i) => ({t, ok: i === 0})));
  document.getElementById('fix').innerHTML = `<p class="q" style="font-size:1.08rem;margin-top:18px">Σωστά, είναι λάθος! Ποιο είναι το σωστό;</p>
    <div class="opts">${S.opts.map((o, i) => `<button class="opt fx" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  app.querySelectorAll('.opt.fx').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    app.querySelectorAll('.opt.fx').forEach((bb, j) => { bb.disabled = true; if (S.opts[j].ok) bb.classList.add('right'); else if (j === i) bb.classList.add('wrong'); else bb.classList.add('dim'); });
    feedback(S.opts[i].ok, q.ex);
  });
  document.getElementById('fix').scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function drawOrder(checked){
  const q = S.list[S.idx], n = q.items.length;
  const slots = document.getElementById('slots'), pool = document.getElementById('pool'), act = document.getElementById('act');
  slots.innerHTML = Array.from({length: n}, (_, k) => {
    const p = S.placed[k];
    if (!p) return `<div class="slot"><span class="n">${k + 1}</span>…</div>`;
    const cls = checked ? (p.i === k ? ' right' : ' wrong') : '';
    return `<div class="slot full${cls}" data-k="${k}"><span class="n">${k + 1}</span>${esc(p.t)}</div>`;
  }).join('');
  pool.innerHTML = S.pool.map((p, j) => `<button class="chip" data-j="${j}">${esc(p.t)}</button>`).join('');
  act.innerHTML = (!checked && S.placed.length === n) ? `<button class="next" id="check">Έλεγχος ✓</button>` : '';
  if (checked) return;
  pool.querySelectorAll('.chip').forEach(c => c.onclick = () => { S.placed.push(S.pool.splice(+c.dataset.j, 1)[0]); drawOrder(); });
  slots.querySelectorAll('.slot.full').forEach(s => s.onclick = () => { S.pool.push(S.placed.splice(+s.dataset.k, 1)[0]); drawOrder(); });
  const ch = document.getElementById('check');
  if (ch) ch.onclick = () => {
    const ok = S.placed.every((p, k) => p.i === k);
    drawOrder(true);
    document.querySelector('.hint').hidden = true;
    feedback(ok, q.ex, ok ? '' : 'Η σωστή σειρά:<ol style="margin:6px 0 0;padding-left:20px">' + q.items.map(t => `<li>${esc(t)}</li>`).join('') + '</ol>');
  };
}

function tapMatch(b){
  if (b.classList.contains('done')) return;
  const q = S.list[S.idx];
  if (b.dataset.side === 'L') { app.querySelectorAll('.mi.l').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); S.sel = b; return; }
  if (!S.sel) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
  if (S.sel.dataset.i === b.dataset.i) {
    S.sel.classList.remove('sel'); S.sel.classList.add('done'); b.classList.add('done'); S.sel = null; S.done++;
    if (S.done === q.pairs.length) {
      const ok = S.err <= 1;
      document.querySelector('.hint').hidden = true;
      feedback(ok, q.ex, S.err === 0 ? 'Όλα με την πρώτη!' : `Λάθη στην πορεία: ${S.err}.${ok ? '' : ' Δοκίμασε ξανά για να τα βρεις με την πρώτη!'}`);
    }
  } else {
    S.err++;
    [b, S.sel].forEach(x => { x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); });
  }
}

function drawSort(){
  const sc = document.getElementById('sc'), it = S.items[S.k];
  sc.classList.toggle('empty', !it);
  sc.textContent = it ? it.t : 'Τέλος!';
  if (it) { sc.style.animation = 'none'; void sc.offsetWidth; sc.style.animation = ''; }
}
function tapSort(b){
  const q = S.list[S.idx], it = S.items[S.k];
  if (!it) return;
  b.classList.remove('shake', 'ok'); void b.offsetWidth;
  if (+b.dataset.g === it.g) {
    b.querySelector('ul').insertAdjacentHTML('beforeend', `<li>${esc(it.t)}</li>`);
    b.classList.add('ok'); setTimeout(() => b.classList.remove('ok'), 450);
    S.k++; drawSort();
    if (S.k === S.items.length) {
      app.querySelectorAll('.bin').forEach(x => x.disabled = true);
      document.querySelector('.hint').hidden = true;
      const ok = S.err <= 1;
      feedback(ok, q.ex, S.err === 0 ? 'Όλα στη σωστή θέση με την πρώτη!' : `Λάθη στην πορεία: ${S.err}.${ok ? '' : ' Δοκίμασε ξανά για να τα βρεις με την πρώτη!'}`);
    }
  } else { S.err++; b.classList.add('shake'); }
}

function results(){
  const n = S.list.length, st = starsFor(S.ok, n), m = S.m;
  if (!S.retry && st > (BEST[m.id] || 0)) { BEST[m.id] = st; save(BEST); }
  const msg = st === 3 ? 'Είσαι αληθινός ιστορικός! 🏛️' : st === 2 ? 'Πολύ καλά! Λίγο ακόμα για τα τρία αστέρια.' : st === 1 ? 'Καλή αρχή! Ρίξε μια ματιά στο βιβλίο και ξαναδοκίμασε.' : 'Διάβασε ξανά το μάθημα και δοκίμασε πάλι. Θα τα καταφέρεις!';
  const missed = S.missed.map(k => S.map[k]);
  const reviewItem = q => q.t === 'tf' ? q.s : q.q;
  app.innerHTML = `<section class="result">
    <div class="eyebrow">${esc(m.title)}${S.retry ? ' · επανάληψη' : ''}</div>
    <div class="medal pop" aria-hidden="true">${st === 3 ? '🏆' : st >= 1 ? '🏅' : '📖'}</div>
    <div class="big-stars">${starStr(st)}</div>
    <h2>${msg}</h2>
    <p class="score">${S.ok} σωστές από ${n}</p>
    ${S.missed.length ? `<div class="review"><div style="border:none;background:none;padding:0;color:var(--muted)">Αυτές θέλουν λίγη επανάληψη:</div>${S.missed.map(k => { const q = S.list[k]; return `<div><b>${KIND[q.t]}</b><br>${esc(reviewItem(q))}</div>`; }).join('')}</div>` : ''}
    ${S.missed.length ? `<button class="next" id="retry">Ξανά μόνο όσες έχασα (${S.missed.length})</button>` : ''}
    <button class="next ${S.missed.length ? 'ghost' : ''}" id="again">${m.pick && m.qs.length > m.pick ? 'Νέος γύρος με άλλες ερωτήσεις' : 'Ξανά από την αρχή'}</button>
    <button class="next ghost" id="home">Όλα τα μαθήματα</button>
  </section>`;
  const r = document.getElementById('retry');
  if (r) r.onclick = () => start(S.mi, missed, true);
  document.getElementById('again').onclick = () => start(S.mi);
  document.getElementById('home').onclick = home;
  window.scrollTo(0, 0);
}

const tb = document.getElementById('theme');
const paintTheme = () => { const d = document.documentElement.dataset.theme === 'dark'; tb.textContent = d ? '☀️' : '🌙'; tb.title = d ? 'Φωτεινό φόντο' : 'Σκοτεινό φόντο'; };
tb.onclick = () => {
  const d = document.documentElement.dataset.theme === 'dark';
  if (d) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = 'dark';
  try { localStorage.setItem('istoria-e-theme', d ? 'light' : 'dark'); } catch (e) {}
  paintTheme();
};
paintTheme();
home();
</script>
</body>
</html>
